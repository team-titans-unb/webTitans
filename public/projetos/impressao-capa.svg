<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Sistema de impressão Web-to-Print: PDF, pagamento por PIX e impressão automática">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4136"/>
      <stop offset="1" stop-color="#f2711c"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="464" height="344" rx="20" fill="#17120f"/>
  <rect x="8" y="8" width="464" height="344" rx="20" fill="none" stroke="url(#g)" stroke-width="2"/>

  <text x="40" y="58" fill="#f5f5f5" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Web-to-Print</text>
  <text x="40" y="82" fill="#9a9a9a" font-family="Inter, system-ui, sans-serif" font-size="13">impressão sob demanda no site da TITANS</text>

  <!-- Etapa 1: PDF -->
  <g transform="translate(40,120)">
    <rect width="112" height="120" rx="14" fill="#211a16" stroke="#3a2e27" stroke-width="1.5"/>
    <rect x="34" y="24" width="44" height="56" rx="5" fill="none" stroke="url(#g)" stroke-width="3"/>
    <line x1="44" y1="40" x2="68" y2="40" stroke="#f2711c" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="52" x2="68" y2="52" stroke="#f2711c" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="64" x2="60" y2="64" stroke="#f2711c" stroke-width="3" stroke-linecap="round"/>
    <text x="56" y="104" fill="#e6e6e6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Envia PDF</text>
  </g>

  <!-- Etapa 2: PIX -->
  <g transform="translate(184,120)">
    <rect width="112" height="120" rx="14" fill="#211a16" stroke="#3a2e27" stroke-width="1.5"/>
    <g transform="translate(34,22)" stroke="url(#g)" stroke-width="3" fill="none" stroke-linejoin="round">
      <rect x="0" y="0" width="16" height="16" rx="2"/>
      <rect x="28" y="0" width="16" height="16" rx="2"/>
      <rect x="0" y="28" width="16" height="16" rx="2"/>
      <path d="M28 28 h16 v16 h-16 z M28 50 h16" stroke-linecap="round"/>
    </g>
    <text x="56" y="104" fill="#e6e6e6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Paga por PIX</text>
  </g>

  <!-- Etapa 3: Impressora -->
  <g transform="translate(328,120)">
    <rect width="112" height="120" rx="14" fill="#211a16" stroke="#3a2e27" stroke-width="1.5"/>
    <g transform="translate(30,24)" stroke="url(#g)" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 14 V4 h28 v10"/>
      <rect x="2" y="14" width="48" height="26" rx="4"/>
      <rect x="12" y="34" width="28" height="20" rx="2" fill="#17120f"/>
      <circle cx="42" cy="22" r="2.4" fill="#f2711c" stroke="none"/>
    </g>
    <text x="56" y="104" fill="#e6e6e6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Imprime só</text>
  </g>

  <!-- Setas -->
  <g stroke="#f2711c" stroke-width="3" fill="#f2711c">
    <line x1="156" y1="180" x2="178" y2="180" stroke-linecap="round"/>
    <path d="M178 174 l10 6 -10 6 z"/>
    <line x1="300" y1="180" x2="322" y2="180" stroke-linecap="round"/>
    <path d="M322 174 l10 6 -10 6 z"/>
  </g>

  <text x="240" y="296" fill="#8f8f8f" font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle">Next.js · Supabase · Mercado Pago · Python · CUPS</text>
  <text x="240" y="320" fill="#6f6f6f" font-family="Inter, system-ui, sans-serif" font-size="11.5" text-anchor="middle">sem intervenção manual da equipe</text>
</svg>
